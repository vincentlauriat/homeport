name: CI
on:
  push: {branches: [main]}
  pull_request:

# Le jeton par défaut est en lecture seule : un workflow de test n'a jamais besoin
# d'écrire dans le dépôt, et une action compromise ne peut donc rien pousser.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      # Actions épinglées au SHA plutôt qu'au tag : un tag peut être redirigé vers
      # un autre commit, un SHA non. Le commentaire garde la version lisible.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check homeport tests
      - run: python -m pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      # Audite les dépendances déclarées du projet, pas l'environnement du runner —
      # sinon le `pip` de GitHub remonte ses propres avis, qui ne nous concernent pas.
      # Ne bloque pas la CI : Homeport n'a pas de mainteneur d'astreinte, et un avis
      # publié un dimanche ne doit pas empêcher un correctif de passer. Le résultat se
      # lit dans le résumé du job.
      - run: pip-audit -r requirements.txt --progress-spinner off || true
