<!doctype html>
<html lang="fr" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Journal — Homeport</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homeport">
  <meta name="theme-color" content="#b8452f">
</head>
<body class="v-edit">
  <main class="edit-page">
    <header class="edit-brand">
      <span>⚓ <span id="j-hostname">homeserver</span> · <span id="j-date">—</span></span>
      <nav class="view-switch">
        <a href="/">Classique</a>
        <a href="/controle">Contrôle</a>
        <a href="/journal" class="current">Journal</a>
        <a href="/mur">Mur</a>
      </nav>
    </header>

    <h1 class="edit-verdict" id="j-verdict">…</h1>
    <p class="edit-story" id="j-story"></p>

    <div class="edit-attention" id="j-attention" hidden></div>

    <h2 class="edit-h2">La machine</h2>
    <div class="edit-facts">
      <div class="efact"><b id="f-cpu">—</b><span id="f-cpu-note">CPU</span></div>
      <div class="efact"><b id="f-temp">—</b><span id="f-temp-note">température</span></div>
      <div class="efact"><b id="f-mem">—</b><span id="f-mem-note">mémoire</span></div>
      <div class="efact"><b id="f-disk">—</b><span id="f-disk-note">disque /</span></div>
    </div>

    <h2 class="edit-h2">Réseau &amp; santé</h2>
    <div class="edit-quiet" id="j-quiet"></div>

    <h2 class="edit-h2" id="j-svc-title">Les services</h2>
    <div id="j-services"></div>

    <footer>
      <span id="refreshed">—</span>
      <span>Homeport v{{ version }}</span>
    </footer>
  </main>

  <script src="/static/views-common.js"></script>
  <script src="/static/journal.js"></script>
</body>
</html>
