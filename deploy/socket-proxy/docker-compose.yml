# docker-socket-proxy — l'API Docker en lecture seule pour Raspweb (chantier B de la roadmap).
#
# Pourquoi : le groupe `docker` équivaut à root. Raspweb ne fait que des GET sur /containers ;
# ce proxy (HAProxy) n'expose QUE cela, sur le loopback uniquement. Même un Raspweb compromis
# ne peut ni créer, ni arrêter, ni exécuter quoi que ce soit — les POST sont refusés par le
# proxy, pas par la bonne volonté du code.
#
# Installé par deploy.sh dans /mnt/ssd/socket-proxy/ et lancé par `docker compose up -d`.
services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    ports:
      # Loopback uniquement : rien sur le LAN ni le tailnet n'atteint cette API.
      - "127.0.0.1:2375:2375"
    environment:
      # État, stats et logs des conteneurs.
      CONTAINERS: 1
      # Lecture des images : indispensable à la comparaison de fraîcheur, qui a besoin du
      # `RepoDigests` local de chaque image (`GET /images/{ref}/json`) pour le confronter au
      # digest publié par le registre. Sans cette ligne le proxy répond 403 et la
      # fonctionnalité se déclare indisponible. N'ouvre que des GET : les POST — build, pull,
      # suppression — restent refusés globalement, comme tout le reste (exec, volumes,
      # réseaux, swarm), au 0 par défaut du proxy.
      IMAGES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
